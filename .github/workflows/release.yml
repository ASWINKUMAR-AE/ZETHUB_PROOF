name: Release package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build and package
        run: npm run package

      - name: Verify archive checksum
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const dir = 'release';
          const zip = fs.readdirSync(dir).find((name) => name.endsWith('.zip'));
          if (!zip) throw new Error('No release archive was produced.');
          const actual = crypto.createHash('sha256').update(fs.readFileSync(path.join(dir, zip))).digest('hex');
          const expected = fs.readFileSync(path.join(dir, `${zip}.sha256`), 'utf8').trim().split(/\s+/)[0];
          if (actual !== expected) throw new Error(`Checksum mismatch for ${zip}: ${actual} != ${expected}`);
          console.log(`Checksum verified for ${zip}: ${actual}`);
          NODE

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zethub-proof-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/*.zip release/*.zip.sha256 --clobber
