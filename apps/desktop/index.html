<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0e15" />
    <title>ZetHub Proof — AI writes the code. ZetHub Proof proves it works.</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0e0e15;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0e0e15;
        color: #c9c9da;
        font:
          14px/1.5 'Segoe UI',
          system-ui,
          sans-serif;
      }
      .boot .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #b8b4f5;
        display: inline-block;
        margin-right: 10px;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <span><span class="dot"></span>Loading ZetHub Proof…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
